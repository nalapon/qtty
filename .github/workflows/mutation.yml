# Mutation testing (Stryker) of reading, the catalog and saving: every Monday and on demand.
# The HTML report is kept as an artifact.

name: mutation

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

jobs:
  stryker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run db:up
      - run: bunx stryker run --reporters clear-text,html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
